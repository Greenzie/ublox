version: 2.1

orbs:
  greenzie: greenzie/build_and_publish_debs@0.2.0

parameters:
  # Use this parameter to change the branch that the deployment jobs are triggered on
  # It's useful for testing the deployment jobs on a different branch before merging
  filter-branch:
    type: string
    default: noetic
  manual_deploy:
    description: "Trigger a manual amd64 deploy to greenzie-experimental"
    type: boolean
    default: false

workflows:
  version: 2
  pushbuild:
    when:
      not: << pipeline.parameters.manual_deploy >>
    jobs:
      # Build jobs
      - greenzie/debian_build:
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64

      # Deployment jobs
      - greenzie/debian_deploy_experimental:
          name: "deploy_amd64_greenzie"
          context: GREENZIE
          filters:
            branches:
              only:
                - << pipeline.parameters.filter-branch >>
          requires:
            - amd_debian_build

  manualdeploy:
    when: << pipeline.parameters.manual_deploy >>
    jobs:
      - greenzie/debian_build:
          name: "amd_debian_build"
          platform: amd64
          executor: greenzie/debianize_amd64

      - greenzie/debian_deploy_experimental_ssh:
          name: "deploy_amd64_greenzie"
          context: GREENZIE
          requires:
            - amd_debian_build
